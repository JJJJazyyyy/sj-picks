<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="logo.png">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>종목 Pick</title>
<link rel="stylesheet" href="style.css?v=33">
<script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header class="top">
  <div class="hl">
    <a class="brand" href="./" title="최신 날짜로"><img src="logo.png" alt="" class="blogo">종목 Pick</a>
    <select id="modeSel" class="dsel" aria-label="모드"></select>
    <select id="laySel" class="dsel" aria-label="배치"></select>
  </div>
  <nav>
    <select id="daySel" aria-label="날짜 선택"></select>
    <a href="#method" class="navlink">선정 방식</a>
    <a href="#perf" class="navlink">지난 종목 성과</a>
    <a href="#archive" class="navlink">아카이브</a>
  </nav>
</header>
<main>
  <section class="dayhead" id="dayhead"></section>
  <section class="box summary" id="summary"></section>
  <div class="jump" id="jump"></div>
  <div id="stocks"></div>
  <section class="box" id="method"></section>
  <section class="box" id="perf">
    <h2>지난 관심종목 성과 <small>진입가 = 선정일 종가 · 선 = 진입 뒤 흐름 · 남색 선 = 진입가 · 파란 점선 = 손절 · 빨간 점 = 최고</small></h2>
    <div id="perfStats" class="stats"></div>
    <div id="perfMini" class="pmini"></div>
    <details class="pdet"><summary>숫자 표로 보기 <small>N거래일 뒤 종가 등락률 · 손절선은 종가 기준</small></summary><div class="tblwrap"><table class="perf" id="perfTbl"></table></div></details>
  </section>
  <section class="box" id="archive">
    <h2>아카이브</h2>
    <div id="archList" class="arch"></div>
  </section>
</main>
<footer>개인 참고용 · 시세 한국투자증권 Open API · 작도는 일봉에서 자동 계산(해석에 따라 다를 수 있음) · <span id="updated"></span></footer>
<script src="app.js?v=36"></script>
</body>
</html>
