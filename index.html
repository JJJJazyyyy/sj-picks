<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>주식 한끼 BEST3</title>
<link rel="stylesheet" href="style.css?v=5">
<script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">주식 한끼 <span>· 주목 종목 BEST3</span></div>
  <nav>
    <select id="daySel" aria-label="날짜 선택"></select>
    <a href="#perf" class="navlink">지난 종목 성과</a>
    <a href="#archive" class="navlink">아카이브</a>
  </nav>
</header>
<main>
  <section class="dayhead" id="dayhead"></section>
  <div class="jump" id="jump"></div>
  <div id="stocks"></div>
  <section class="box" id="perf">
    <h2>지난 관심종목 성과 <small>기준가 = 선정일 종가 · N거래일 뒤 종가 등락률 · 손절선은 종가 기준</small></h2>
    <div id="perfStats" class="stats"></div>
    <div class="tblwrap"><table class="perf" id="perfTbl"></table></div>
  </section>
  <section class="box" id="archive">
    <h2>아카이브</h2>
    <div id="archList" class="arch"></div>
  </section>
</main>
<footer>개인 참고용 · 시세 한국투자증권 Open API · 작도는 일봉에서 자동 계산(해석에 따라 다를 수 있음) · <span id="updated"></span></footer>
<script src="app.js?v=5"></script>
</body>
</html>
